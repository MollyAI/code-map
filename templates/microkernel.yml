# Microkernel / Plugin — A minimal core loads plugins that extend it through
# well-defined contracts. Plugin-based tools, IDEs, browser extensions (incl. this plugin).
id: microkernel
name: "Microkernel / Plugin"
description: "A minimal core loads plugins that extend it through well-defined contracts."

layers:
  - id: core
    name: Core / Host
    order: 0
    summary_zh: "加载并协调插件的内核/宿主(含 RTOS 内核/架构/HAL)"
    summary_en: "The kernel/host that loads and coordinates plugins (incl. RTOS kernel/arch/HAL)"
    path_segments: [core, host, kernel, engine, runtime, arch, kal, hal, bsp]
    name_suffixes: [Kernel, Host, Engine, Runtime]
  - id: contracts
    name: Contracts / API
    order: 1
    summary_zh: "扩展点、SPI、面向插件的接口"
    summary_en: "Extension points, SPIs, plugin-facing interfaces"
    path_segments: [api, contract, contracts, spi, interfaces, extensionpoint, extensionpoints]
    name_suffixes: [Api, Spi, Contract, ExtensionPoint]
  - id: plugins
    name: Plugins / Extensions
    order: 2
    summary_zh: "实现契约的插件、扩展、组件、驱动、子系统"
    summary_en: "Plugins, extensions, components, drivers, subsystems implementing the contracts"
    path_segments: [plugin, plugins, extension, extensions, addon, addons, modules, integrations,
                    component, components, driver, drivers, subsystem, subsystems]
    name_suffixes: [Plugin, Extension, Addon, Integration, Driver]
  - id: infrastructure
    name: Infrastructure
    order: 3
    summary_zh: "插件加载、注册表、配置、工具"
    summary_en: "Plugin loading, registry, config, utilities"
    path_segments: [loader, registry, config, util, utils, common, internal]
    name_suffixes: [Loader, Registry, Manager, Config, Util]

signals:
  files:
    - {match: "*plugin.json",  weight: 3}
    - {match: "manifest.json", weight: 2}
    # RTOS / embedded kernel build systems (OpenHarmony LiteOS, Zephyr, NuttX, …)
    - {match: "Kconfig",       weight: 3}
    - {match: "BUILD.gn",      weight: 3}
    - {match: "bundle.json",   weight: 2}
  dependencies:
    - {match: "pf4j",      weight: 5}
    - {match: "org.osgi",  weight: 4}
    - {match: "osgi",      weight: 3}
    - {match: "pluggy",    weight: 4}
    - {match: "stevedore", weight: 4}
  paths:
    - {match: "plugins",    weight: 4}
    - {match: "extensions", weight: 4}
    - {match: "plugin",     weight: 3}
    - {match: "extension",  weight: 3}
    # Microkernel/RTOS kernel-tree directory names. A plain components/ dir is
    # intentionally NOT a signal here (it would steal frontend/ECS projects);
    # these names are unambiguous kernel markers.
    - {match: "kernel",     weight: 4}
    - {match: "arch",       weight: 3}
    - {match: "kal",        weight: 3}
    - {match: "drivers",    weight: 3}
    - {match: "subsystems", weight: 3}
    - {match: "hal",        weight: 2}
    - {match: "bsp",        weight: 2}
